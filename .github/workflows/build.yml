name: Build

# Reusable build matrix shared by the Pull Request and Release workflows.
# Builds and tests each plugin, pushes coverage and JUnit results to Codecov,
# and (for releases) packages the plugin DLL into a versioned zip artifact.
on:
  workflow_call:
    inputs:
      plugins:
        description: JSON array of plugin directory names to build.
        required: true
        type: string
      version:
        description: Explicit version. Empty resolves the next dev version from tags.
        required: false
        type: string
        default: ''
      fancontrol_version:
        description: FanControl release tag used to fetch FanControl.Plugins.dll.
        required: false
        type: string
        default: V269
      package:
        description: Package the built DLL into a zip artifact (release builds).
        required: false
        type: boolean
        default: false
    secrets:
      CODECOV_TOKEN:
        required: false

jobs:
  build:
    runs-on: windows-2025
    strategy:
      fail-fast: false
      matrix:
        plugin: ${{ fromJSON(inputs.plugins) }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # tags needed to derive the dev version

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Build.props') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Fetch FanControl.Plugins.dll
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          FANCONTROL_VERSION: ${{ inputs.fancontrol_version }}
        run: |
          set -euo pipefail
          URL=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/Rem0o/FanControl.Releases/releases/tags/${FANCONTROL_VERSION}" \
            | jq -r '.assets[] | select(.name|test("\\.zip$")) | select(.name|test("net_4_8")|not) | .browser_download_url' \
            | head -n1)
          test -n "$URL" || { echo "No matching .zip asset for ${FANCONTROL_VERSION}"; exit 1; }
          echo "Downloading $URL"
          curl -fsSL "$URL" -o fc.zip
          mkdir -p lib
          unzip -oq fc.zip 'FanControl.Plugins.dll' -d lib
          test -f lib/FanControl.Plugins.dll || { echo "FanControl.Plugins.dll not found in asset"; exit 1; }

      - name: Resolve version
        id: v
        shell: bash
        run: |
          set -euo pipefail
          P="${{ matrix.plugin }}"
          if [[ -n "${{ inputs.version }}" ]]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Preview the NEXT version. Bump level is derived from the Conventional
          # Commit subjects touching this plugin since its last tag.
          SHA=$(git rev-parse --short HEAD)
          LASTTAG=$(git tag -l "${P}/v*" --sort=-v:refname | head -n1 || true)
          BASE="${LASTTAG##*/v}"; BASE="${BASE:-0.0.0}"
          IFS=. read -r MA MI PA <<< "$BASE"
          MA="${MA:-0}"; MI="${MI:-0}"; PA="${PA:-0}"
          RANGE=""; [ -n "$LASTTAG" ] && RANGE="${LASTTAG}..HEAD"
          # Transition shim: include the pre-rename directory so the first
          # FanControl.Rgb release still sees its history (git path filters do
          # not follow the FanControl.OpenRGB -> FanControl.Rgb rename).
          OLD=""; [ "$P" = "FanControl.Rgb" ] && OLD="FanControl.OpenRGB"
          LOG=$(git log $RANGE --pretty='%s%n%b' -- "$P" $OLD)
          if grep -qE '^[a-z]+(\([^)]*\))?!:|^BREAKING[ -]CHANGE' <<< "$LOG"; then
            MA=$((MA+1)); MI=0; PA=0
          elif grep -qE '^feat(\([^)]*\))?:' <<< "$LOG"; then
            MI=$((MI+1)); PA=0
          else
            PA=$((PA+1))
          fi
          echo "version=${MA}.${MI}.${PA}-dev.${SHA}" >> "$GITHUB_OUTPUT"

      - name: Build ${{ matrix.plugin }}
        run: dotnet build ${{ matrix.plugin }}/${{ matrix.plugin }}.csproj -c Release -p:Version=${{ steps.v.outputs.version }}

      - name: Test ${{ matrix.plugin }}
        if: hashFiles(format('{0}.Tests/{0}.Tests.csproj', matrix.plugin)) != ''
        run: >
          dotnet test ${{ matrix.plugin }}.Tests/${{ matrix.plugin }}.Tests.csproj -c Release
          --collect:"XPlat Code Coverage" --results-directory coverage
          --logger "junit;LogFilePath=test-results/${{ matrix.plugin }}.junit.xml"

      - name: Upload coverage to Codecov
        if: hashFiles(format('{0}.Tests/{0}.Tests.csproj', matrix.plugin)) != ''
        uses: codecov/codecov-action@v5
        with:
          files: coverage/**/coverage.cobertura.xml
          flags: ${{ matrix.plugin }}
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload test results to Codecov
        if: ${{ !cancelled() && hashFiles(format('{0}.Tests/{0}.Tests.csproj', matrix.plugin)) != '' }}
        uses: codecov/test-results-action@v1
        with:
          # JUnit LogFilePath is resolved relative to the test project dir.
          files: ${{ matrix.plugin }}.Tests/test-results/${{ matrix.plugin }}.junit.xml
          flags: ${{ matrix.plugin }}
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Package
        if: inputs.package
        shell: pwsh
        run: |
          $dll = "${{ matrix.plugin }}/bin/Release/net8.0-windows/${{ matrix.plugin }}.dll"
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path $dll -DestinationPath "dist/${{ matrix.plugin }}-${{ steps.v.outputs.version }}.zip" -Force

      - uses: actions/upload-artifact@v7
        if: inputs.package
        with:
          name: ${{ matrix.plugin }}
          path: dist/*.zip
          retention-days: 1
